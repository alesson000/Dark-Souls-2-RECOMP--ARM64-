plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fromsoftware.darksouls2'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fromsoftware.darksouls2'
        minSdk 30
        targetSdk 34
        versionCode 10
        versionName '1.0.10'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
